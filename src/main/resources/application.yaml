spring:
  application:
    name: encurtador-url

  data:
    redis:
      host: localhost
      port: 6379
    
  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false

  datasource:
    url: jdbc:postgresql://localhost:5432/url_shortener
    username: postgres
    password: postgres

  hikari:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000


app:
  shortener:
    base-url: ${APP_SHORTENER_BASE_URL:http://localhost:8080/}